data:
  raw_path: 'data/raw/MFG10YearTerminationData.csv'
  target_column: 'STATUS'
  numeric_columns:
    - 'age'
    - 'length_of_service'
  categorical_columns:
    - 'orighiredate_key'
    - 'city_name'
    - 'department_name'
    - 'job_title'
    - 'store_name'
    - 'gender_short'
    - 'STATUS_YEAR'
    - 'BUSINESS_UNIT'
  date_columns:
    - 'orighiredate_key'
    - 'STATUS_YEAR'
  test_size: 0.2
  random_state: 42

model:
  model_type: 'RandomForestClassifier'  # Can be RandomForestClassifier, LinearRegression, or LogisticRegression
  parameters: # Make sure to adjust these parameters based on the model type
    n_estimators: 300
    max_depth: 12
    min_samples_split: 2
    class_weight: 'balanced'
    random_state: 42

mlflow:
  experiment_name: 'employee_attrition'

evaluation:
  metrics:  # Can include any combination of the following metrics based on the model type: accuracy, precision, recall, f1_score, auc_roc
    - 'accuracy'
    - 'precision'
    - 'recall'
    - 'f1_score'
  min_f1: 0.50  # Minimum F1 score required to consider the model as acceptable
  min_precision: 0.45  # Minimum precision required to consider the model as acceptable
  min_accuracy: 0.80  # Minimum accuracy required to consider the model as acceptable
  min_recall: 0.50  # Minimum recall required to consider the model as acceptable

monitoring:
  drift_threshold: 0.3
  report_path: 'reports/drift_report.html'
